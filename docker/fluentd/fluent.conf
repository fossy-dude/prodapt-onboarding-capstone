# Fluentd: receive logs from application containers and route to stdout (dev)
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# PII redaction filter — strips sensitive fields before any external export
<filter **>
  @type record_transformer
  enable_ruby true
  <record>
    # Redact common PII fields if present
    msisdn ${record.key?("msisdn") ? "[REDACTED]" : nil}
    document_number ${record.key?("document_number") ? "[REDACTED]" : nil}
  </record>
</filter>

<match **>
  @type stdout
</match>
