# Fluentd: receive logs from application containers and route to stdout (dev)
<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

# PII redaction filter — strips sensitive fields before any external export.
# Uses __pii_scratch__ key (removed after) to modify record in-place via Ruby,
# avoiding nil injection into records that lack the redacted fields.
<filter **>
  @type record_transformer
  enable_ruby true
  remove_keys __pii_scratch__
  <record>
    __pii_scratch__ ${
      record["msisdn"] = "[REDACTED]" if record.key?("msisdn");
      record["document_number"] = "[REDACTED]" if record.key?("document_number");
      record["subscriber_name"] = "[REDACTED]" if record.key?("subscriber_name");
      record["email"] = "[REDACTED]" if record.key?("email");
      record["token"] = "[REDACTED]" if record.key?("token");
      nil
    }
  </record>
</filter>

<match **>
  @type stdout
</match>
