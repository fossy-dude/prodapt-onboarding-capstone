include:
  - docker-compose-dependencies.yaml

services:
  # ---------------------------------------------------------------------------
  # Logging / observability routing (replaces Fluentd):
  # There is NO Fluentd or per-container log-driver layer. Each APP container
  # emits OTLP (traces + metrics + logs) directly to otel-collector, which
  # forwards every signal to otel-tui (see otel-collector-config.yaml).
  # Infra containers (postgres/redpanda/valkey/ministack/langfuse) do NOT emit
  # OTLP — view their logs via `podman logs <svc>`.
  #
  # App-side requirement (CODE, not compose): Python apps must export logs over
  # OTLP — either attach opentelemetry-sdk's logging handler to the root logger,
  # or run under the `opentelemetry-instrument` launcher. The OTEL_* env vars
  # below only configure WHERE to export; they don't bridge Python logging → OTLP.
  # ---------------------------------------------------------------------------

  cdr-pipeline:
    build:
      context: ../cdr-pipeline
    # .env.docker (if present) wins key-by-key over .env — see cdr-pipeline/.env.docker.
    env_file:
      - path: ../cdr-pipeline/.env
        required: false
      - path: ../cdr-pipeline/.env.docker
        required: false
    environment:
      DATABASE_URL: postgresql://sboai_app:${POSTGRES_APP_PASSWORD}@postgres:5432/sboai
      KAFKA_BOOTSTRAP_SERVERS: redpanda:29092
      VALKEY_URL: redis://valkey:6379
      # OTLP export → otel-collector (no Fluentd). Collector forwards to otel-tui.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: cdr-pipeline
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started

  service_webapp:
    build:
      context: ../service_webapp
    # .env.docker (if present) wins key-by-key over .env — see service_webapp/.env.docker.
    env_file:
      - path: ../service_webapp/.env
        required: false
      - path: ../service_webapp/.env.docker
        required: false
    environment:
      DATABASE_URL: postgresql://sboai_app:${POSTGRES_APP_PASSWORD}@postgres:5432/sboai
      VALKEY_URL: redis://valkey:6379
      # OTLP export → otel-collector (no Fluentd). Collector forwards to otel-tui.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SERVICE_NAME: service_webapp
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      # Langfuse SDK export. In Docker, use the service DNS name, not localhost.
      LANGFUSE_ENABLED: ${LANGFUSE_ENABLED:-true}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-http://langfuse:3000}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-lf_pk_**}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-lf_sk_**}
    volumes:
      # Milvus Lite .db file; HARD CONSTRAINT: deploy.replicas must stay at 1.
      # Milvus Lite embeds a single-process SQLite-backed file; >1 replica corrupts it.
      # Scale-out requires migrating to Milvus Distributed (Target State, EKS).
      - milvus_lite_data:/app/data/milvus
    deploy:
      replicas: 1
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
      langfuse:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
    # .env.docker (if present) wins key-by-key over .env — see frontend/.env.docker.
    env_file:
      - path: ../frontend/.env
        required: false
      - path: ../frontend/.env.docker
        required: false
    ports:
      - "5173:5173"
    depends_on:
      - service_webapp
