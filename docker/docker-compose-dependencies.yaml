services:
  redpanda:
    image: redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --mode dev-container
      - --smp 1
      - --memory 256M
      - --reserve-memory 0M
      - --node-id 0
      - --check=false
    ports:
      - "9092:9092"
      - "29092:29092"

  valkey:
    image: valkey/valkey:8-alpine
    command: >
      valkey-server
      --maxmemory 512mb
      --maxmemory-policy noeviction
    # maxmemory rationale (ARCH-1.7.3):
    #   balance keys:     300K × ~50B  ≈  15MB
    #   USSD sessions:    peak 10K × ~1KB ≈ 10MB
    #   OTP keys:         peak 50K × ~50B ≈  2MB
    #   chat contexts:    peak 5K  × ~2KB ≈ 10MB
    #   overhead + headroom:             ≈ 475MB
    # noeviction is MANDATORY: balance:{msisdn} keys must never be evicted.
    volumes:
      - valkey_data:/data
    ports:
      - "6379:6379"

  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    environment:
      POSTGRES_DB: sboai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sboai"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  flyway:
    image: flyway/flyway:10-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/sboai
      FLYWAY_USER: sboai_flyway
      FLYWAY_PASSWORD: ${POSTGRES_FLYWAY_PASSWORD}
      FLYWAY_SCHEMAS: public
      FLYWAY_CONNECT_RETRIES: 10
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ../service_webapp/db/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse:
    image: langfuse/langfuse:3
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_SUPERUSER_PASSWORD}@postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-dev_secret_change_me_32chars_min}
      SALT: ${LANGFUSE_SALT:-dev_salt_change_me}
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_AUTO_MIGRATE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"

  ministack:
    image: localstack/localstack:latest
    environment:
      SERVICES: cognito-idp,s3
      PERSISTENCE: 1
      DEBUG: "0"
    volumes:
      # LocalStack uses a unified state dir; ministack_cognito holds all state.
      # ministack_s3 declared in volumes section per ARCH-29 but not separately mounted.
      - ministack_cognito:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "4566:4566"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics

  otel-tui:
    image: ymtdzzz/otel-tui:latest
    stdin_open: true
    tty: true
    ports:
      - "14317:4317"
    environment:
      OTEL_TUI_LISTEN_ON_OTLP: "true"

  fluentd:
    image: fluent/fluentd:v1.17-debian-1
    volumes:
      - ./fluentd/fluent.conf:/fluentd/etc/fluent.conf
    ports:
      - "24224:24224"
      - "24224:24224/udp"

volumes:
  postgres_data:
  valkey_data:
  ministack_cognito:
  ministack_s3:
  milvus_lite_data:  # Milvus Lite .db file — persisted via service_webapp container (ARCH-1.7.4)
