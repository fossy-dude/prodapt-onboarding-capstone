[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "service-webapp"
version = "0.1.0"
description = "Primary Webapp-Backend Service. API endpoints for all frontend API calls (REST and WS calls for agentic workflows)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[async,pool]>=3.2",
    "valkey[asyncio]>=6",
    "aiokafka>=0.11",
    "pymilvus[milvus-lite]>=2.4",
    "copilotkit>=0.1",
    "pydantic-settings>=2.3",
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langfuse>=2",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "weasyprint>=62",
    "scikit-learn>=1.5",
    "uuid7>=0.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pyrefly",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres,redis,kafka]>=4",
    "tox>=4",
    "tox-uv>=1",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = lint, typecheck, test
runner = uv-venv-runner

[testenv:lint]
deps = ruff
commands =
    ruff check src/ tests/
    ruff format --check src/ tests/

[testenv:test]
deps =
    pytest
    pytest-asyncio
    httpx
    testcontainers[postgres,redis]
commands = pytest tests/ -v --tb=short
"""
