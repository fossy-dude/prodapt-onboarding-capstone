# CI gate for the service_webapp backend and the frontend.
# Runs on every PR (and on pushes to main). All jobs must pass before merge —
# enforce this via GitHub branch protection (Settings → Branches → require these
# status checks: `service_webapp (lint + typecheck + test)`, `frontend (lint + test)`).
#
# The quality gate is `uvx --with tox-uv tox` (the tox-uv plugin supplies the
# uv-venv-runner). architecture.md §1.12.1 documents `uv tox`, but that is not a
# real `uv` subcommand; `uvx --with tox-uv tox` is the equivalent invocation and
# matches the local `just tox` / `just lint` recipes. See Story 1.3 Completion Notes.

name: CI Pipeline (service_webapp + frontend)

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]

concurrency:
  group: ci-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service_webapp:
    name: service_webapp (lint + typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service_webapp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "service_webapp/pyproject.toml"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Lint (ruff + pyrefly)
        run: uvx --with tox-uv tox -e lint

      - name: Test (pytest)
        run: uvx --with tox-uv tox -e test

  frontend:
    name: frontend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Lint (ESLint)
        run: npm run lint

      - name: Test (Vitest)
        run: npm run test
